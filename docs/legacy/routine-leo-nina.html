<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ma routine du matin</title>
<style>
  :root {
    --sky-deep: #1B2A4A; --sky-mid: #2E4370; --sky-mid-light: #3E5688;
    --dawn-gold: #F4A340; --go-green: #4CAF7D; --go-green-light: #8FE0B8;
    --cloud-white: #F7F5F0; --cloud-dim: #AEBBD6; --floor: #253A63;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; min-height:100%; width:100%; overflow-x:hidden;
    background: var(--sky-deep); color: var(--cloud-white);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none;
  }
  #app { max-width: 480px; margin: 0 auto; position:relative; min-height:100vh; }
  .screen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition: opacity .3s ease; padding: 16px 16px 24px;
  }
  .screen.active { opacity:1; pointer-events:auto; position:relative; }

  #screen-profils { align-items:center; justify-content:center; }
  #titre-accueil { text-align:center; font-size: 24px; color: var(--cloud-dim); font-weight:700; }
  #conteneur-profils { display:flex; gap:30px; flex-wrap:wrap; justify-content:center; margin-top:32px; }
  .carte-profil {
    width: 220px; height: 220px; border-radius: 36px; background: var(--sky-mid);
    border: 3px solid var(--sky-mid-light); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap: 12px; font-size: 24px; font-weight:800;
    transition: transform .15s ease, background .15s ease;
  }
  .carte-profil:active { transform: scale(0.94); background: var(--sky-mid-light); }
  .carte-profil .avatar-emoji { font-size: 72px; }

  #screen-avatar { align-items:center; }
  .barre-haut { display:flex; align-items:center; justify-content:space-between; width:100%; padding: 4px 4px 10px; }
  .btn-retour { background:none; border:none; color: var(--cloud-dim); font-size:17px; font-weight:700; padding:10px; }
  #titre-avatar { font-size: 19px; font-weight:800; text-align:center; margin: 2px 0 14px; }
  #apercu-avatar-wrap { width: 150px; height: 200px; margin: 0 auto 18px; position:relative; }
  #apercu-avatar-wrap img { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  .reglage-avatar {
    display:flex; align-items:center; justify-content:space-between; width:100%; max-width:320px;
    margin: 0 auto 12px; background: var(--sky-mid); border-radius:20px; padding: 8px 6px;
  }
  .btn-fleche { width:44px; height:44px; border-radius:50%; border:none; background: var(--sky-mid-light); color: var(--cloud-white); font-size:20px; font-weight:800; }
  .btn-fleche:active { background: var(--dawn-gold); color: var(--sky-deep); }
  .label-reglage { font-size:15px; font-weight:700; color: var(--cloud-dim); }
  .btn-valider { margin-top: 14px; background: var(--go-green); color: var(--sky-deep); border:none; font-size:18px; font-weight:800; padding: 15px 38px; border-radius: 40px; }

  #screen-routine { padding: 14px 14px 0; }
  .barre-routine { display:flex; align-items:center; justify-content:space-between; padding: 2px 2px 10px; flex-shrink:0; }
  .prenom-actif { font-size: 20px; font-weight:800; }
  .compteur { font-size:15px; color: var(--dawn-gold); font-weight:800; background: rgba(244,163,64,0.14); padding:6px 14px; border-radius:18px; }

  #scene {
    position:relative; height: 230px; border-radius: 22px; overflow:hidden; flex-shrink:0;
    background: linear-gradient(180deg, var(--sky-mid) 0%, var(--sky-mid) 70%, var(--floor) 70%, var(--floor) 100%);
    border: 3px solid var(--sky-mid-light); margin-bottom:10px;
  }
  #perso-wrap {
    position:absolute; left:50%; bottom: 12px; width: 126px; height: 168px;
    transform: translateX(-50%);
  }
  #perso-wrap.pop { animation: popPerso .35s ease; }
  @keyframes popPerso {
    0%   { transform: translateX(-50%) scale(1); }
    40%  { transform: translateX(-50%) scale(1.14); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #perso-wrap img { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; transition: opacity .15s ease; }

  .zone-cible {
    position:absolute; left:-10px; right:-10px; border-radius:14px;
    border: 3px dashed transparent; pointer-events:none; transition: border-color .15s ease, background .15s ease;
  }
  .zone-cible.active { border-color: var(--dawn-gold); background: rgba(244,163,64,0.16); }
  #zone-tete   { top: -8px; height: 38%; }
  #zone-torse  { top: 34%;  height: 32%; }
  #zone-jambes { top: 64%;  height: 40%; }

  .prop { position:absolute; bottom: 18px; width: 62px; height:50px; transition: outline-color .15s ease; border-radius: 12px; }
  .prop img { width:100%; height:100%; image-rendering:pixelated; }
  #prop-bol { left: 16px; } #prop-sac { right: 14px; }
  .prop.active { outline: 3px dashed var(--dawn-gold); outline-offset: 3px; background: rgba(244,163,64,0.16); }

  #plateau { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding: 8px 4px 12px; min-height: 74px; }
  .item-plateau {
    width: 62px; height:62px; border-radius:50%; background: var(--sky-mid-light);
    display:flex; align-items:center; justify-content:center; font-size:30px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.22); touch-action:none; cursor:grab;
  }
  .item-plateau.en-cours-glisse { box-shadow: 0 10px 14px rgba(0,0,0,0.35); }

  #chemin { padding-bottom: 20px; }
  .noeud {
    display:flex; align-items:center; gap:12px; min-height: 54px; margin-bottom: 8px;
    padding: 6px 14px 6px 8px; background: var(--sky-mid); border-radius: 18px; border: 2px solid transparent;
    transition: background .2s ease, border-color .2s ease; opacity: 0.85;
  }
  .noeud.fait { background: rgba(76,175,125,0.14); border-color: var(--go-green); opacity:1; }
  .pastille-mini { width: 34px; height:34px; min-width:34px; border-radius:50%; background: var(--sky-mid-light); display:flex; align-items:center; justify-content:center; font-size: 18px; }
  .noeud.fait .pastille-mini { background: var(--go-green); }
  .texte-etape { font-size: 14px; font-weight:600; flex:1; color: var(--cloud-dim); }
  .noeud.fait .texte-etape { color: var(--go-green-light); }
  .coche-mini { font-size:18px; color: var(--go-green-light); opacity:0; transition: opacity .2s ease; }
  .noeud.fait .coche-mini { opacity:1; }

  #screen-bravo { align-items:center; justify-content:center; text-align:center; gap:14px; background: linear-gradient(180deg, var(--sky-deep), #131F38); }
  #screen-bravo .emoji-bravo { font-size: 100px; animation: bounce 1s ease infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-16px);} }
  #screen-bravo h1 { font-size: 30px; margin:0; }
  .btn-continuer { margin-top: 20px; background: var(--dawn-gold); color: var(--sky-deep); border:none; font-size:18px; font-weight:800; padding: 16px 36px; border-radius: 40px; }

  .btn-reglages { position:fixed; top:14px; right:14px; width:40px; height:40px; border-radius:50%; background: rgba(255,255,255,0.08); border:none; color: var(--cloud-dim); font-size:16px; z-index:5; }

  @media (prefers-reduced-motion: reduce) { *, .pop { animation:none !important; } }
</style>
</head>

let enfantActif = null;
let choixAvatar = { skin: 0, hair: 0 };
let dragCtx = null;

function cleJour() { const d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function chargerAvatar(id){ try{ const b=localStorage.getItem("avatar_"+id); if(b) return JSON.parse(b); }catch(e){} return null; }
function sauverAvatar(id,c){ try{ localStorage.setItem("avatar_"+id, JSON.stringify(c)); }catch(e){} }
function chargerEtat(id){
  let etat=null;
  try{ const b=localStorage.getItem("routine_"+id); etat=b?JSON.parse(b):null; }catch(e){}
  if(!etat || etat.jour!==cleJour()){ etat={jour:cleJour(), fait:[]}; sauverEtatRoutine(id, etat); }
  return etat;
}
function sauverEtatRoutine(id,etat){ try{ localStorage.setItem("routine_"+id, JSON.stringify(etat)); }catch(e){} }

function afficherEcran(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function construireAccueil(){
  const c=document.getElementById("conteneur-profils"); c.innerHTML="";
  CONFIG.enfants.forEach(enfant=>{
    const carte=document.createElement("div");
    carte.className="carte-profil";
    carte.innerHTML=`<div class="avatar-emoji">${enfant.avatarEmoji}</div><div>${enfant.prenom}</div>`;
    carte.onclick=()=>choisirProfil(enfant.id);
    c.appendChild(carte);
  });
}

function choisirProfil(id){
  enfantActif = CONFIG.enfants.find(e=>e.id===id);
  const existant = chargerAvatar(id);
  if(existant){ choixAvatar = existant; construireEcranRoutine(); }
  else { choixAvatar = {skin:0,hair:0}; ouvrirCreateurAvatar(); }
}

function ouvrirCreateurAvatar(){
  document.getElementById("titre-avatar").textContent = "Crée ton avatar, "+enfantActif.prenom+" !";
  majApercuAvatar();
  afficherEcran("screen-avatar");
}
function changerReglage(type,dir){
  const opts = type==="skin"?SKIN_OPTIONS:HAIR_OPTIONS;
  choixAvatar[type] = (choixAvatar[type]+dir+opts.length)%opts.length;
  majApercuAvatar();
}
function majApercuAvatar(){
  const skin=SKIN_OPTIONS[choixAvatar.skin], hair=HAIR_OPTIONS[choixAvatar.hair];
  document.getElementById("apercu-avatar").src = SPRITES[`av_${skin}_${hair}_ebouriffe`];
  document.getElementById("label-skin").textContent = "Carnation "+(choixAvatar.skin+1)+"/"+SKIN_OPTIONS.length;
  document.getElementById("label-hair").textContent = "Cheveux "+(choixAvatar.hair+1)+"/"+HAIR_OPTIONS.length;
}
function validerAvatar(){ sauverAvatar(enfantActif.id, choixAvatar); construireEcranRoutine(); }

function baseSpriteActuel(){
  const skin=SKIN_OPTIONS[choixAvatar.skin], hair=HAIR_OPTIONS[choixAvatar.hair];
  const etat=chargerEtat(enfantActif.id);
  const coiffe = etat.fait.includes(indexEtape("coiffer"));
  return SPRITES[`av_${skin}_${hair}_${coiffe?"coiffe":"ebouriffe"}`];
}
function indexEtape(id){ return enfantActif.etapes.findIndex(e=>e.id===id); }

function construireEcranRoutine(){
  document.getElementById("routine-prenom").textContent = enfantActif.prenom;
  const etat = chargerEtat(enfantActif.id);
  if(etat.fait.length === enfantActif.etapes.length){ afficherBravo(); return; }
  synchroniserUI();
  afficherEcran("screen-routine");
}

function synchroniserUI(){
  const etat = chargerEtat(enfantActif.id);

  document.getElementById("img-base").src = baseSpriteActuel();
  enfantActif.etapes.forEach((e,i)=>{
    const fait = etat.fait.includes(i);
    if(e.type==="overlay") document.getElementById(e.cible).style.opacity = fait?"1":"0";
    if(e.type==="prop") document.getElementById(e.cible).src = SPRITES[fait?e.etatFait:e.etatPasFait];
  });

  const liste = document.getElementById("chemin"); liste.innerHTML="";
  enfantActif.etapes.forEach((e,i)=>{
    const fait = etat.fait.includes(i);
    const noeud = document.createElement("div");
    noeud.className = "noeud"+(fait?" fait":"");
    noeud.innerHTML = `<div class="pastille-mini">${e.emoji}</div><div class="texte-etape">${e.texte}</div><div class="coche-mini">✓</div>`;
    noeud.onclick = ()=> marquerEtape(i, !fait);
    liste.appendChild(noeud);
  });

  const plateau = document.getElementById("plateau"); plateau.innerHTML="";
  enfantActif.etapes.forEach((e,i)=>{
    if(etat.fait.includes(i)) return;
    const item = document.createElement("div");
    item.className = "item-plateau";
    item.textContent = e.emoji;
    plateau.appendChild(item);
    rendreGlissable(item, e, i);
  });

  mettreAJourCompteur();
}

function mettreAJourCompteur(){
  const etat=chargerEtat(enfantActif.id);
  document.getElementById("routine-compteur").textContent = etat.fait.length+"/"+enfantActif.etapes.length;
}

function marquerEtape(index, valeur){
  const etat = chargerEtat(enfantActif.id);
  const pos = etat.fait.indexOf(index);
  if(valeur && pos===-1) etat.fait.push(index);
  if(!valeur && pos!==-1) etat.fait.splice(pos,1);
  sauverEtatRoutine(enfantActif.id, etat);
  synchroniserUI();
  if(valeur){
    jouerSon();
    if(navigator.vibrate) navigator.vibrate(45);
    const w=document.getElementById("perso-wrap");
    w.classList.remove("pop"); void w.offsetWidth; w.classList.add("pop");
  }
  if(etat.fait.length === enfantActif.etapes.length) setTimeout(()=>afficherBravo(),500);
}

function rendreGlissable(el, etape, index){
  function debut(ev){
    ev.preventDefault();
    const rect = el.getBoundingClientRect();
    dragCtx = { el, index, etape, offsetX: ev.clientX-rect.left, offsetY: ev.clientY-rect.top,
                startLeft: rect.left, startTop: rect.top, w: rect.width, h: rect.height };
    el.setPointerCapture(ev.pointerId);
    Object.assign(el.style, { position:"fixed", left:rect.left+"px", top:rect.top+"px",
      width:rect.width+"px", height:rect.height+"px", zIndex:"100", transition:"none" });
    el.classList.add("en-cours-glisse");
    const zone = document.getElementById(etape.zone);
    if(zone) zone.classList.add("active");
  }
  function deplace(ev){
    if(!dragCtx || dragCtx.el!==el) return;
    el.style.left = (ev.clientX-dragCtx.offsetX)+"px";
    el.style.top = (ev.clientY-dragCtx.offsetY)+"px";
  }
  function fin(ev){
    if(!dragCtx || dragCtx.el!==el) return;
    const zoneEl = document.getElementById(etape.zone);
    let succes = false;
    if(zoneEl){
      const zr=zoneEl.getBoundingClientRect(), er=el.getBoundingClientRect();
      const cx=er.left+er.width/2, cy=er.top+er.height/2;
      succes = cx>=zr.left && cx<=zr.right && cy>=zr.top && cy<=zr.bottom;
    }
    if(zoneEl) zoneEl.classList.remove("active");
    if(succes){
      el.style.transition = "transform .18s ease, opacity .18s ease";
      el.style.transform = "scale(0.3)";
      el.style.opacity = "0";
      setTimeout(()=> marquerEtape(index, true), 160);
    } else {
      el.style.transition = "left .3s ease, top .3s ease";
      el.style.left = dragCtx.startLeft+"px";
      el.style.top = dragCtx.startTop+"px";
      setTimeout(()=>{
        Object.assign(el.style, {position:"", left:"", top:"", width:"", height:"", zIndex:"", transition:""});
        el.classList.remove("en-cours-glisse");
      }, 300);
    }
    dragCtx = null;
  }
  el.addEventListener("pointerdown", debut);
  el.addEventListener("pointermove", deplace);
  el.addEventListener("pointerup", fin);
  el.addEventListener("pointercancel", fin);
}

function afficherBravo(){
  document.getElementById("bravo-titre").textContent = "Bravo "+enfantActif.prenom+" !";
  afficherEcran("screen-bravo");
}
function retourAccueil(){ enfantActif=null; afficherEcran("screen-profils"); }
function reinitialiserTout(){
  if(confirm("Réinitialiser toutes les routines du jour ?")){
    CONFIG.enfants.forEach(e=>{ try{ localStorage.removeItem("routine_"+e.id); }catch(err){} });
    if(enfantActif) construireEcranRoutine();
  }
}
function jouerSon(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25].forEach((freq,i)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type="sine"; osc.frequency.value=freq;
      const t0=ctx.currentTime+i*0.12;
      gain.gain.setValueAtTime(0.001,t0);
      gain.gain.linearRampToValueAtTime(0.25,t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,t0+0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.3);
    });
  }catch(e){}
}

construireAccueil();
</script>
